<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>케이스뱅크 트레이너</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#273449; --ink:#e2e8f0; --muted:#94a3b8;
  --accent:#38bdf8; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --line:#334155;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.55;overscroll-behavior:none}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 40px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.3px;white-space:nowrap;flex:0 0 auto}
.bar{display:flex;gap:5px;flex-wrap:nowrap;font-size:12px;color:var(--muted);justify-content:flex-end}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
.pill b{color:var(--accent)}
.pill.ok b{color:var(--ok)} .pill.bad b{color:var(--bad)}

/* 설정/필터 패널 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h2{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg button{flex:1;min-width:60px;background:var(--card2);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:9px 8px;font-size:14px;font-weight:600;cursor:pointer;transition:.12s}
.seg button.on{background:var(--accent);color:#04263a;border-color:var(--accent)}
.seg.small button{font-size:13px;padding:7px 6px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:13px;color:var(--muted);min-width:54px}
input[type=text]{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);padding:9px 12px;font-size:15px}
.start{width:100%;background:var(--accent);color:#04263a;border:none;border-radius:12px;
  padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px}
.start:active{transform:scale(.98)}

/* 카드 */
.stage{flex:1;display:flex;flex-direction:column}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;
  margin-bottom:12px;position:relative}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px}
.qmeta .box{color:var(--warn)}
.case{font-size:18px;line-height:1.6;word-break:keep-all}
.ask{margin-top:14px;font-size:14px;color:var(--accent);font-weight:600}

/* 플립 정답 */
.answer{background:var(--card2);border:1px dashed var(--accent);border-radius:14px;padding:16px;margin-bottom:12px}
.answer .code{font-size:22px;font-weight:800;color:var(--accent)}
.answer .name{font-size:16px;font-weight:700;margin-top:2px}
.answer .kw{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}

/* 객관식 보기 */
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  font-size:15px;cursor:pointer;text-align:left;color:var(--ink);transition:.1s;display:flex;gap:10px;align-items:baseline}
.opt .oc{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
.opt:active{transform:scale(.99)}
.opt.correct{background:rgba(34,197,94,.16);border-color:var(--ok)}
.opt.correct .oc{color:var(--ok)}
.opt.wrong{background:rgba(239,68,68,.16);border-color:var(--bad)}
.opt.wrong .oc{color:var(--bad)}
.opt.dim{opacity:.45}

/* 액션 버튼 */
.acts{display:flex;gap:10px}
.acts button{flex:1;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:800;cursor:pointer}
.btn-show{background:var(--accent);color:#04263a}
.btn-ok{background:var(--ok);color:#04200f}
.btn-bad{background:var(--bad);color:#2a0606}
.btn-next{background:var(--card2);color:var(--ink);border:1px solid var(--line)!important}

.feedback{font-size:14px;padding:12px 14px;border-radius:12px;margin-bottom:10px;line-height:1.5}
.feedback.ok{background:rgba(34,197,94,.12);border:1px solid var(--ok)}
.feedback.bad{background:rgba(239,68,68,.12);border:1px solid var(--bad)}
.feedback b{color:var(--accent)}

.empty{text-align:center;color:var(--muted);padding:40px 10px}
.foot{margin-top:14px;text-align:center}
.foot button{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}
.hidden{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);
  border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:14px;
  opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.streak{font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 케이스뱅크</h1>
    <div class="bar" id="topbar"></div>
  </header>

  <!-- 시작 화면 -->
  <div id="home">
    <div class="panel">
      <h2>뱅크</h2>
      <div class="seg" id="bank">
        <button data-v="defect" class="on">🔴 결함사례</button>
        <button data-v="check">🟦 주요확인사항</button>
      </div>
      <h2>학습 모드</h2>
      <div class="seg" id="mode">
        <button data-v="type" class="on">🔢 번호입력</button>
        <button data-v="flash">🔄 플립카드</button>
        <button data-v="mc">📝 객관식</button>
      </div>
      <h2>출제 범위 — 영역</h2>
      <div class="seg small" id="area">
        <button data-v="0" class="on">전체</button>
        <button data-v="1">1영역</button>
        <button data-v="2">2영역</button>
        <button data-v="3">3영역</button>
      </div>
      <h2>필터</h2>
      <div class="seg small" id="filter">
        <button data-v="all">전체</button>
        <button data-v="todo" class="on">📚 미암기</button>
        <button data-v="weak">🔴 약점만</button>
        <button data-v="new">🆕 안 푼 것</button>
      </div>
      <div style="font-size:12px;color:var(--muted);margin:-2px 0 4px">미암기 = 완전암기(box5)를 뺀 전부 — 안 푼 것 + 약점 + 아직 box2~4</div>
      <div class="row">
        <label>기준</label>
        <input type="text" id="codeq" placeholder="예: 2.6  /  3.3.2 (비워두면 전체)">
      </div>
      <button class="start" id="startBtn">시작하기 →</button>
    </div>
    <div class="panel" id="statsPanel">
      <h2>진도 (이 기기에 저장)</h2>
      <div id="statsBody" style="font-size:14px;color:var(--muted)"></div>
      <div class="foot"><button id="resetBtn">진도 초기화</button></div>
    </div>
  </div>

  <!-- 풀이 화면 -->
  <div id="play" class="stage hidden">
    <div class="qcard">
      <div class="qmeta">
        <span><span id="qpos"></span> <span class="box" id="qbox"></span></span>
      </div>
      <div class="case" id="qcase"></div>
      <div class="ask" id="qask">가장 직접적인 인증기준 1개는?</div>
    </div>

    <!-- 번호입력 모드 -->
    <div id="typeArea">
      <div class="feedback hidden" id="typeFb"></div>
      <div class="row" id="typeInputRow">
        <input type="text" id="typeIn" placeholder="인증번호 입력 (예: 3.3.2) — 명칭도 인정"
          autocomplete="off" autocapitalize="off" autocorrect="off" inputmode="text">
      </div>
      <div class="acts" id="typeActs">
        <button class="btn-show" id="typeSubmit">제출</button>
      </div>
      <div class="acts hidden" id="typeNextActs">
        <button class="btn-next" id="typeNext">다음 →</button>
      </div>
    </div>

    <!-- 플립 모드 -->
    <div id="flashArea">
      <div class="answer hidden" id="ansBox">
        <div class="code" id="ansCode"></div>
        <div class="name" id="ansName"></div>
        <div class="kw" id="ansKw"></div>
      </div>
      <div class="acts" id="flashActs">
        <button class="btn-show" id="showBtn">정답 보기</button>
      </div>
      <div class="acts hidden" id="gradeActs">
        <button class="btn-bad" id="gradeBad">✗ 틀림</button>
        <button class="btn-ok" id="gradeOk">✓ 맞음</button>
      </div>
    </div>

    <!-- 객관식 모드 -->
    <div id="mcArea" class="hidden">
      <div class="feedback hidden" id="mcFb"></div>
      <div class="opts" id="mcOpts"></div>
      <div class="acts hidden" id="mcNextActs">
        <button class="btn-next" id="mcNext">다음 →</button>
      </div>
    </div>

    <div class="foot"><button id="quitBtn">← 종료하고 처음으로</button></div>
  </div>

  <div id="done" class="stage hidden">
    <div class="panel" style="text-align:center">
      <h2>세션 종료</h2>
      <div id="doneBody" style="font-size:16px"></div>
      <button class="start" id="againBtn" style="margin-top:14px">다시 시작</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

const CRIT = DATA.criteria, PAIRS = DATA.pairs;
const BANKS = { defect: DATA.cases, check: DATA.checks };
const PFXMAP = { defect: "casebank_v1:", check: "checkbank_v1:" };
const ASKMAP = { defect: "가장 직접적인 인증기준 1개는?", check: "이 점검항목은 어느 인증기준?" };
// 뱅크별로 진도(PFX)·문항집합(CASES)이 갈린다. 토글 시 셋 다 교체된다.
let BANK = "defect";
let CASES = BANKS[BANK];
let PFX = PFXMAP[BANK];

// ---- 스토리지 레이어 (iOS Safari file://는 localStorage 접근 시 throw → 인메모리 폴백) ----
const MEM = {};
let LS = null;
try { LS = window.localStorage; LS.setItem("__probe__","1"); LS.removeItem("__probe__"); }
catch(e){ LS = null; }   // file:// on iOS / 프라이빗 모드 → 메모리로 폴백
function lsGet(k){ if(LS){ try{ return LS.getItem(k); }catch(e){} } return (k in MEM)?MEM[k]:null; }
function lsSet(k,v){ if(LS){ try{ LS.setItem(k,v); return; }catch(e){} } MEM[k]=v; }
function lsDel(k){ if(LS){ try{ LS.removeItem(k); return; }catch(e){} } delete MEM[k]; }
function lsKeys(){ if(LS){ try{ return Object.keys(LS); }catch(e){} } return Object.keys(MEM); }
const PERSIST = !!LS;

// ---- 영속 상태 (카드별 Leitner 박스) ----
function load(id){ try{ return JSON.parse(lsGet(PFX+id)) || null; }catch(e){ return null; } }
function save(id,o){ lsSet(PFX+id, JSON.stringify(o)); }
function getCard(id){ return load(id) || {box:1, seen:0, ok:0, bad:0}; }
function isWeak(id){ const c=load(id); return c ? (c.box<=1 || c.bad>c.ok) : false; }
function isNew(id){ return !load(id); }
// 완전암기(box5) 도달 여부 — 미암기 필터의 단일 판정축.
// box2~4 이면서 정답이 우세한 카드는 weak/new 어느 쪽에도 안 걸리므로 이 필터로만 잡힌다.
function isMastered(id){ const c=load(id); return !!c && c.box>=5; }

// ---- code → name 룩업 (101개 기준 전체 — 뱅크 무관) ----
const NAME = {};
Object.keys(CRIT).forEach(k=>{ NAME[k]=CRIT[k].name; });
const ALL_CODES = Object.keys(CRIT);

// ---- code → 주요확인사항(점검 질문) 목록 (결함 정답 공개 시 함께 표시 → "결함=확인사항 위반" 훈련) ----
const CHK_BY_CODE = {};
DATA.checks.forEach(x=>{ (CHK_BY_CODE[x.code]=CHK_BY_CODE[x.code]||[]).push(x.case); });
function checksHtml(code){
  const qs = CHK_BY_CODE[code]||[];
  if(!qs.length) return '';
  let h = `<div style="margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)">`
    + `<div style="font-size:12px;color:var(--muted);margin-bottom:5px">📋 이 기준의 점검 질문 ${qs.length}개 — 결함이 어느 항목에 '아니오'인지 맞춰보기</div>`;
  qs.forEach((q,i)=>{ h += `<div style="font-size:13px;line-height:1.5;margin:4px 0"><b style="color:var(--accent)">${i+1}.</b> ${q}</div>`; });
  return h + `</div>`;
}

// 인접 페어 인덱스
const ADJ = {};
PAIRS.forEach(grp=>grp.forEach(c=>{ ADJ[c]=(ADJ[c]||[]).concat(grp.filter(x=>x!==c)); }));

// ---- distractor 생성 (인접페어 > 같은 앞2자리 > 랜덤) ----
function prefix2(code){ const p=code.split('.'); return p[0]+'.'+p[1]; }
function distractors(correct, n){
  const pool=[], used=new Set([correct]);
  (ADJ[correct]||[]).forEach(c=>{ if(!used.has(c)&&CRIT[c]){pool.push(c);used.add(c);} });
  const pf=prefix2(correct);
  shuffle(ALL_CODES).forEach(c=>{ if(!used.has(c)&&prefix2(c)===pf){pool.push(c);used.add(c);} });
  shuffle(ALL_CODES).forEach(c=>{ if(!used.has(c)){pool.push(c);used.add(c);} });
  return pool.slice(0,n);
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// ---- 큐 구성 (필터 + Leitner 가중) ----
let MODE='type', AREA=0, FILTER='todo', CODEQ='', QUEUE=[], QI=0, sess={ok:0,bad:0,n:0};

function buildQueue(){
  let pool = CASES.filter(c=>{
    if(AREA && c.area!==AREA) return false;
    if(CODEQ && !c.code.startsWith(CODEQ)) return false;
    if(FILTER==='todo' && isMastered(c.id)) return false;
    if(FILTER==='weak' && !isWeak(c.id)) return false;
    if(FILTER==='new' && !isNew(c.id)) return false;
    return true;
  });
  // 출제 순서 = 완전 랜덤 셔플 (매 세션 다른 순서). 약점 우선은 약점만/안 푼 것 필터가 담당.
  return shuffle(pool);
}

// ---- 렌더 ----
const $=id=>document.getElementById(id);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1100); }

function renderTop(){
  const total=CASES.length;
  let learned=0, weak=0;
  CASES.forEach(c=>{ const s=load(c.id); if(s){learned++; if(s.box<=1||s.bad>s.ok)weak++;} });
  $('topbar').innerHTML =
    `<span class="pill">전체 <b>${total}</b></span>`+
    `<span class="pill ok">학습 <b>${learned}</b></span>`+
    `<span class="pill bad">약점 <b>${weak}</b></span>`;
}
function renderStats(){
  const total=CASES.length; let learned=0,box5=0;
  CASES.forEach(c=>{const s=load(c.id); if(s){learned++; if(s.box>=5)box5++;}});
  $('statsBody').innerHTML =
    `학습한 사례 <b style="color:var(--ink)">${learned}/${total}</b> · `+
    `완전암기(box5) <b style="color:var(--ok)">${box5}</b> · `+
    `미암기 <b style="color:var(--warn)">${total-box5}</b> · `+
    `미학습 <b style="color:var(--warn)">${total-learned}</b>`+
    (PERSIST ? '' :
      `<div style="margin-top:8px;color:var(--warn);font-size:13px">⚠️ 이 환경에선 진도가 저장되지 않습니다(앱 닫으면 초기화). `+
      `아이폰은 파일을 직접 열면 그렇습니다 — URL(예: Netlify)로 열거나 홈 화면에 추가하면 저장됩니다.</div>`);
}

function startSession(){
  QUEUE=buildQueue(); QI=0; sess={ok:0,bad:0,n:0};
  if(QUEUE.length===0){
    toast(FILTER==='new'  ? '🎉 안 푼 사례를 모두 풀었습니다 — 미암기로 복습하세요'
        : FILTER==='todo' ? '🎉 이 범위는 전부 완전암기(box5) 달성 — 전체로 재확인하세요'
        : '조건에 맞는 사례가 없습니다');
    return;
  }
  $('home').classList.add('hidden'); $('done').classList.add('hidden'); $('play').classList.remove('hidden');
  showQ();
}
function showQ(){
  if(QI>=QUEUE.length){ return finish(); }
  const c=QUEUE[QI], st=getCard(c.id);
  $('qpos').textContent=`${QI+1} / ${QUEUE.length}`;
  $('qbox').textContent=`box ${st.box}/5${st.bad>st.ok?' · 약점':''}`;
  $('qask').textContent=ASKMAP[BANK];
  $('qcase').textContent=c.case;
  if(MODE==='flash') renderFlash(c);
  else if(MODE==='mc') renderMC(c);
  else renderType(c);
}

// 모드별 영역 표시 토글
function showArea(name){
  $('typeArea').classList.toggle('hidden', name!=='type');
  $('flashArea').classList.toggle('hidden', name!=='flash');
  $('mcArea').classList.toggle('hidden', name!=='mc');
}

// 플립
function renderFlash(c){
  showArea('flash');
  $('ansBox').classList.add('hidden'); $('flashActs').classList.remove('hidden'); $('gradeActs').classList.add('hidden');
  $('ansCode').textContent=c.code;
  $('ansName').textContent=c.name;
  $('ansKw').innerHTML= (c.keyword ? ('🔑 '+c.keyword) : '') + (BANK==='defect'?checksHtml(c.code):'');
}
$('showBtn').onclick=()=>{
  $('ansBox').classList.remove('hidden'); $('flashActs').classList.add('hidden'); $('gradeActs').classList.remove('hidden');
};
$('gradeOk').onclick=()=>grade(true);
$('gradeBad').onclick=()=>grade(false);

// 번호입력 (주관식 인출)
let typeAnswered=false;
function normCode(s){ return (s||'').replace(/\s+/g,'').replace(/[·∙]/g,'').trim(); }
function normName(s){ return (s||'').replace(/[\s·∙]/g,'').trim(); }
function renderType(c){
  showArea('type');
  typeAnswered=false;
  $('typeFb').classList.add('hidden');
  $('typeInputRow').classList.remove('hidden'); $('typeActs').classList.remove('hidden'); $('typeNextActs').classList.add('hidden');
  const inp=$('typeIn'); inp.value=''; inp.disabled=false; setTimeout(()=>inp.focus(),50);
}
function submitType(){
  if(typeAnswered) return;
  const c=QUEUE[QI], raw=$('typeIn').value;
  if(!normCode(raw) && !normName(raw)) return;
  typeAnswered=true;
  $('typeIn').disabled=true;
  $('typeActs').classList.add('hidden'); $('typeNextActs').classList.remove('hidden');
  // 관용 채점: 코드 일치 OR 명칭 포함 일치
  const inCode=normCode(raw);
  const correct = inCode===normCode(c.code) || (normName(raw).length>=2 && normName(c.name).includes(normName(raw)));
  const fb=$('typeFb'); fb.classList.remove('hidden'); fb.className='feedback '+(correct?'ok':'bad');
  if(correct){
    fb.innerHTML=`✓ 정답 — <b>${c.code} ${c.name}</b>`+(c.keyword?`<br>🔑 ${c.keyword}`:'');
  }else{
    let sw='';
    // 입력한 게 인접기준이면 가르기 코칭
    const guess = ALL_CODES.find(x=>normCode(x)===inCode);
    if(guess && ((ADJ[guess]||[]).includes(c.code) || (ADJ[c.code]||[]).includes(guess)))
      sw=`<br>⚠️ <b>${guess}</b>는 <b>${c.code}</b>의 인접기준 — 전제조건 차이로 가르세요.`;
    fb.innerHTML=`✗ 정답은 <b>${c.code} ${c.name}</b>`+(c.keyword?`<br>🔑 ${c.keyword}`:'')+sw;
  }
  fb.innerHTML += (BANK==='defect'?checksHtml(c.code):'');
  commit(c.id, correct);
}
$('typeSubmit').onclick=submitType;
$('typeNext').onclick=()=>{ QI++; showQ(); };
$('typeIn').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); typeAnswered?(QI++,showQ()):submitType(); } });

// 객관식
let mcAnswered=false;
function renderMC(c){
  showArea('mc');
  $('mcFb').classList.add('hidden'); $('mcNextActs').classList.add('hidden');
  mcAnswered=false;
  const opts = shuffle([c.code, ...distractors(c.code,4)]);
  const box=$('mcOpts'); box.innerHTML='';
  opts.forEach((code,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="oc">${i+1}</span><span>${code} ${NAME[code]||''}</span>`;
    b.onclick=()=>pickMC(b, code, c);
    box.appendChild(b);
  });
}
function pickMC(btn, code, c){
  if(mcAnswered) return; mcAnswered=true;
  const correct = code===c.code;
  document.querySelectorAll('.opt').forEach(o=>{
    const t=o.textContent;
    if(t.includes(c.code+' ')) o.classList.add('correct');
    else o.classList.add('dim');
  });
  if(!correct) btn.classList.add('wrong');
  const fb=$('mcFb'); fb.classList.remove('hidden');
  fb.className='feedback '+(correct?'ok':'bad');
  if(correct){
    fb.innerHTML=`✓ 정답 — <b>${c.code} ${c.name}</b>` + (c.keyword?`<br>🔑 ${c.keyword}`:'');
  }else{
    let sw='';
    if((ADJ[code]||[]).includes(c.code) || (ADJ[c.code]||[]).includes(code))
      sw=`<br>⚠️ <b>${code}</b>와 <b>${c.code}</b>는 인접기준 — 전제조건 차이로 가르세요.`;
    fb.innerHTML=`✗ 정답은 <b>${c.code} ${c.name}</b>` + (c.keyword?`<br>🔑 ${c.keyword}`:'') + sw;
  }
  fb.innerHTML += (BANK==='defect'?checksHtml(c.code):'');
  $('mcNextActs').classList.remove('hidden');
  commit(c.id, correct);
}
$('mcNext').onclick=()=>{ QI++; showQ(); };

// 채점 공통
function grade(ok){ commit(QUEUE[QI].id, ok); QI++; showQ(); }
function commit(id, ok){
  const st=getCard(id);
  st.seen++; sess.n++;
  if(ok){ st.ok++; st.box=Math.min(5,st.box+1); sess.ok++; }
  else  { st.bad++; st.box=1; sess.bad++; }
  save(id, st);
}

function finish(){
  $('play').classList.add('hidden'); $('done').classList.remove('hidden');
  const pct = sess.n? Math.round(sess.ok/sess.n*100):0;
  $('doneBody').innerHTML =
    `<div style="font-size:40px;font-weight:800;color:var(--accent)">${sess.ok}/${sess.n}</div>`+
    `<div style="color:var(--muted)">정답률 ${pct}% · 틀림 ${sess.bad}건</div>`+
    `<div style="font-size:13px;color:var(--muted);margin-top:8px">틀린 사례는 box1로 강등되어 다음 세션에서 먼저 나옵니다.</div>`;
  renderTop(); renderStats();
}

// 세그먼트 토글 바인딩
function bindSeg(id, cb){
  $(id).querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ $(id).querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); cb(b.dataset.v); };
  });
}
bindSeg('bank', v=>{ BANK=v; CASES=BANKS[BANK]; PFX=PFXMAP[BANK]; renderTop(); renderStats(); });
bindSeg('mode', v=>MODE=v);
bindSeg('area', v=>AREA=+v);
bindSeg('filter', v=>FILTER=v);
$('codeq').oninput=e=>CODEQ=e.target.value.trim();
$('startBtn').onclick=startSession;
$('againBtn').onclick=()=>{ $('done').classList.add('hidden'); $('home').classList.remove('hidden'); };
$('quitBtn').onclick=()=>{ $('play').classList.add('hidden'); $('home').classList.remove('hidden'); renderTop(); renderStats(); };
$('resetBtn').onclick=()=>{
  if(confirm('이 기기의 모든 진도를 지웁니다. 계속할까요?')){
    lsKeys().filter(k=>k.startsWith(PFX)).forEach(k=>lsDel(k));
    renderTop(); renderStats(); toast('초기화 완료');
  }
};

renderTop(); renderStats();
</script>
</body>
</html>
